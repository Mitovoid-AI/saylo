# Every push to main: build Saylo for Windows, publish a GitHub Release (v0.1.<run number>) with the
# installer and the standalone exe, then deploy the website in site/ to GitHub Pages.
# Public builds carry no API key: users add their own free Groq key during setup.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      SAYLO_VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build Saylo.exe and Saylo-Setup.exe
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements.txt
          .\build.ps1
          if (-not (Test-Path dist\Saylo-Setup.exe)) { throw "Saylo-Setup.exe was not built" }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:SAYLO_VERSION" dist\Saylo-Setup.exe dist\Saylo.exe `
            --title "Saylo $env:SAYLO_VERSION" --target $env:GITHUB_SHA --generate-notes

  pages:
    needs: windows
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
