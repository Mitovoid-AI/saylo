# Every push to main: build Sayvra for Windows and the Android keyboard, publish a GitHub Release
# (v0.1.<run number>) with the installer, the standalone exe and sayvra-android.apk, then deploy the
# website in site/ to GitHub Pages.
# Sayvra was called Saylo: each release also carries the installer and APK under their old names
# (Saylo-Setup.exe, saylo-android.apk), which Saylo's in-app updater looks for. Drop them once old copies have updated.
# Public builds carry no API key: users add their own free Groq key during setup.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  SAYLO_VERSION: 0.1.${{ github.run_number }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build Sayvra.exe and Sayvra-Setup.exe
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --disable-pip-version-check -r requirements.txt
          .\build.ps1
          if (-not (Test-Path dist\Sayvra-Setup.exe)) { throw "Sayvra-Setup.exe was not built" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/Sayvra-Setup.exe
            dist/Sayvra.exe

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Signed with the release key when the ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets
      # exist; otherwise with this run's debug key (then a new APK can't update an installed one).
      - name: Build sayvra-android.apk
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SAYLO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SAYLO_BUILD: ${{ github.run_number }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/saylo.jks"
            export SAYLO_KEYSTORE="$RUNNER_TEMP/saylo.jks"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: the APK is signed with a throwaway debug key."
          fi
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../sayvra-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: sayvra-android.apk

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/Sayvra-Setup.exe out/Saylo-Setup.exe
          cp out/sayvra-android.apk out/saylo-android.apk
          gh release create "v$SAYLO_VERSION" out/Sayvra-Setup.exe out/Sayvra.exe out/sayvra-android.apk \
            out/Saylo-Setup.exe out/saylo-android.apk \
            --repo "$GITHUB_REPOSITORY" --title "Sayvra $SAYLO_VERSION" --target "$GITHUB_SHA" --generate-notes

  pages:
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
