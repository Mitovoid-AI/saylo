<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Saylo</title>
<link rel="stylesheet" href="app.css">
<style>
  /* Small corner card shown when the window is closed to the tray (app.py: Api._show_tray_popup). */
  body{background:var(--bg);overflow:hidden}
  .pop{height:100vh;padding:20px 20px 18px;display:flex;flex-direction:column;
       opacity:0;transform:translateY(14px);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.8,.2,1)}
  .pop.in{opacity:1;transform:none}
  .pop.out{opacity:0;transform:translateY(8px);transition:opacity .3s ease,transform .3s ease}
  .top{display:flex;gap:14px;align-items:flex-start}
  .mark{flex:none;width:40px;height:40px;border-radius:12px;background:var(--ink);display:flex;align-items:center;justify-content:center;gap:3px}
  .mark i{width:4px;border-radius:2px;background:#7FE0C2;animation:bar 1.1s ease-in-out infinite}
  .mark i:nth-child(1){height:10px} .mark i:nth-child(2){height:18px;animation-delay:.15s}
  .mark i:nth-child(3){height:24px;animation-delay:.3s} .mark i:nth-child(4){height:14px;animation-delay:.45s}
  @keyframes bar{50%{transform:scaleY(.45)}}
  h2{font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:-.01em;margin:1px 0 5px}
  p{color:var(--muted);font-size:13.5px;line-height:1.55}
  .acts{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-left:54px}
  .open{background:var(--accent);color:#fff;border-radius:10px;height:34px;padding:0 16px;font-size:13.5px;font-weight:600;transition:background .15s}
  .open:hover{background:var(--accent-ink)}
  .dismiss{color:var(--muted);font-size:13.5px;font-weight:500;padding:6px 4px}
  .dismiss:hover{color:var(--ink)}
  .timer{position:fixed;left:0;bottom:0;height:2px;background:var(--accent-soft);width:100%}
  .timer b{display:block;height:100%;background:var(--accent);width:100%;transform-origin:left}
</style>
</head>
<body>
<div class="pop" id="pop">
  <div class="top">
    <div class="mark"><i></i><i></i><i></i><i></i></div>
    <div>
      <h2>Saylo is still listening</h2>
      <p>Hold <span id="keys"><span class="kbd">Ctrl</span>+<span class="kbd">Win</span></span> in any app to dictate.</p>
    </div>
  </div>
  <div class="acts">
    <button class="open" id="open">Open Saylo</button>
    <button class="dismiss" id="dismiss">Got it</button>
  </div>
</div>
<div class="timer"><b id="bar"></b></div>
<script>
  const SHOW_MS = 4000;
  const pop = document.getElementById("pop"), bar = document.getElementById("bar");
  let left = SHOW_MS, last = 0, hovering = false, closing = false;

  function close(open) {
    if (closing) return;
    closing = true;
    pop.classList.add("out");
    setTimeout(() => open ? pywebview.api.open_app() : pywebview.api.close(), 300);
  }
  // The countdown pauses while the pointer is on the card, so the buttons can be reached.
  function tick(t) {
    if (last && !hovering) left -= t - last;
    last = t;
    bar.style.transform = `scaleX(${Math.max(left, 0) / SHOW_MS})`;
    if (left <= 0) return close(false);
    if (!closing) requestAnimationFrame(tick);
  }
  document.body.addEventListener("mouseenter", () => hovering = true);
  document.body.addEventListener("mouseleave", () => hovering = false);
  document.getElementById("open").onclick = () => close(true);
  document.getElementById("dismiss").onclick = () => close(false);

  window.addEventListener("pywebviewready", async () => {
    const keys = await pywebview.api.hotkey();
    document.getElementById("keys").innerHTML = keys.map(k => `<span class="kbd">${k}</span>`).join("+");
    requestAnimationFrame(() => pop.classList.add("in"));
    requestAnimationFrame(tick);
  });
</script>
</body>
</html>
